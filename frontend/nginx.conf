# Frontend container (platform step 6.5, docs/platform/06-admin.md §7, P2).
# One address for pages and API, so the sign-in cookie works exactly as on the dev server:
#   /admin/...  admin app (admin/index.html)    /...  tester app (index.html)    /api/...  backend on backend:8000
# The backend's own /login, /inspector and /docs are not passed on; they stay on :8000 until the new screens replace them.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off; # redirects keep the address the browser used (:8080 on the laptop), not the container's port 80

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;      # no limit here: the backend checks upload.max_size_mb (editable in admin)
        proxy_request_buffering off; # a video goes straight to the backend instead of being stored here first
        proxy_buffering off;         # live run events (SSE) reach the browser as they happen
        proxy_read_timeout 1h;       # an event stream stays open while a run works
        include /etc/nginx/carlens-headers.conf;
    }

    # Built JS / CSS: names change with every build, so the browser may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/carlens-headers.conf;
    }

    location = /admin {
        return 301 /admin/;
    }

    # /admin/users, /admin/runs, ... are routes of the admin app: all get its page. Pages are never cached,
    # so a new build shows up on the next load.
    location /admin/ {
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/carlens-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/carlens-headers.conf;
    }
}
