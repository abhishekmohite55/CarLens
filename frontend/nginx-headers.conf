# Safety headers on every page and file (included in each location of nginx.conf: nginx drops the server's
# add_header lines in a location that has its own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# Hardening A8a: HTTPS only for a year. Browsers ignore it over plain HTTP (laptop, phone on Wi-Fi).
add_header Strict-Transport-Security "max-age=31536000" always;
