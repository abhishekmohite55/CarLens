# Content Security Policy for the app and admin pages (hardening A8a); not on /api, /inspector or /docs.
# Report-Only for now (owner, 20 Nov 2026): nothing is blocked, the browser console lists what would be.
# Switch to "Content-Security-Policy" after a clean check in production (batch F).
# Allowed: our own files; Google sign-in (script, button frame, its styles and calls); Google Fonts (admin pages);
# inline styles (React style props and the sign-in button); images from us, data: and blob:.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
