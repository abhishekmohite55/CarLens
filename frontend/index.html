<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarLens</title>
    <!-- Geist is served from our own site and loaded before the first text is painted (no fallback-font flash). -->
    <link rel="preload" href="/src/app/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Theme before the first paint: the saved choice, else the device setting (src/app/theme.tsx keeps it after). -->
    <!-- A file, not inline code, so the page's CSP needs no 'unsafe-inline' for scripts (hardening A8a). -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
