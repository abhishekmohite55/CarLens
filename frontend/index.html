<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarLens</title>
    <!-- Geist is served from our own site and loaded before the first text is painted (no fallback-font flash). -->
    <link rel="preload" href="/src/tester/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Theme before the first paint: the saved choice, else the device setting (src/tester/theme.tsx keeps it after). -->
    <script>
      try {
        var t = localStorage.getItem("carlens-theme");
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tester/main.tsx"></script>
  </body>
</html>
