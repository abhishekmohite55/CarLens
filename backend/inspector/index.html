<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarLens Inspector</title>
<style>
  body { font-family: monospace; background: #111; color: #ddd; margin: 0; padding: 16px; }
  h1 { color: #fff; margin: 0 0 8px; font-size: 18px; }
  .section { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 12px; margin: 12px 0; }
  label { display: block; margin-bottom: 4px; color: #aaa; font-size: 12px; }
  input[type=text], input[type=file] { background: #222; color: #eee; border: 1px solid #444; padding: 6px 8px; border-radius: 3px; width: 100%; box-sizing: border-box; font-family: monospace; }
  button { background: #2a5caa; color: #fff; border: none; padding: 8px 16px; border-radius: 3px; cursor: pointer; font-family: monospace; }
  button:hover { background: #3a6cbf; }
  button:disabled { background: #444; cursor: default; }
  .status { font-size: 12px; color: #aaa; margin-top: 6px; }
  .ok { color: #6f9; }
  .err { color: #f66; }
  .warn { color: #fb0; }
  .progress-bar { background: #333; border-radius: 2px; height: 6px; margin: 6px 0; }
  .progress-fill { background: #8fd5b5; height: 6px; border-radius: 2px; width: 0; transition: width 0.2s; }
  #events-log { max-height: 300px; overflow-y: auto; font-size: 11px; }
  .event-line { border-bottom: 1px solid #222; padding: 3px 0; }
  .node-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 11px; }
  .node-cell { background: #222; border-radius: 2px; padding: 4px 6px; text-align: center; }
  .node-waiting { opacity: 0.5; }
  .node-running { border: 1px solid #ffb020; color: #ffb020; }
  .node-done { border: 1px solid #8fd5b5; color: #8fd5b5; }
  .node-failed { border: 1px solid #e5484d; color: #e5484d; }
  .node-skipped { opacity: 0.4; text-decoration: line-through; }
  pre { background: #0a0a0a; padding: 10px; border-radius: 3px; overflow-x: auto; font-size: 11px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .file-link { color: #6af; text-decoration: none; font-size: 12px; margin-right: 12px; }
  .file-link:hover { text-decoration: underline; }
  #run-id-display { color: #8fd5b5; font-size: 13px; margin-top: 6px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tab-btn { background: #222; color: #aaa; border: 1px solid #444; padding: 4px 10px; border-radius: 3px 3px 0 0; cursor: pointer; font-family: monospace; font-size: 12px; }
  .tab-btn.active { background: #1a1a1a; color: #eee; border-bottom-color: #1a1a1a; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  table { border-collapse: collapse; width: 100%; font-size: 11px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #2a2a2a; }
  th { color: #aaa; }
  .locate-progress { font-size: 12px; color: #ffb020; margin-left: 8px; }
  .frames-thumb { max-height: 60px; cursor: pointer; border-radius: 2px; vertical-align: middle; }
  .frames-thumb:hover { opacity: 0.8; }
</style>
</head>
<body>
<h1>CarLens Inspector <span style="color:#555;font-size:12px">dev tool</span></h1>

<div class="section">
  <label>Upload limits (from /api/config)</label>
  <div id="limits" class="status">loading…</div>
</div>

<div class="section">
  <label>Pick a video and upload</label>
  <input type="file" id="file-input" accept="video/*">
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <div id="upload-status" class="status"></div>
  <button id="upload-btn" onclick="doUpload()" disabled>Upload</button>
  <div id="run-id-display"></div>
</div>

<div class="section">
  <label>Inspect a run (paste run id or use ?run=… in URL)</label>
  <input type="text" id="run-id-input" placeholder="r_YYYYMMDD_HHMMSS_xxxx">
  <button onclick="loadRun(document.getElementById('run-id-input').value.trim())" style="margin-top:6px">Load run</button>
</div>

<div class="section" id="run-section" style="display:none">
  <label>Node statuses</label>
  <div class="node-grid" id="node-grid"></div>

  <label style="margin-top:12px">Run files</label>
  <div id="file-links"></div>

  <label style="margin-top:12px">meta.json</label>
  <pre id="meta-json">(loading…)</pre>

  <label style="margin-top:12px">Live events</label>
  <div id="events-log"></div>
</div>

<div class="section" id="locate-section" style="display:none">
  <label>Locate (Gemini) <span id="locate-status-badge" class="node-waiting"></span><span class="locate-progress" id="locate-progress-msg"></span></label>
  <div class="tabs">
    <button class="tab-btn active" onclick="showLocateTab('sent')">Sent</button>
    <button class="tab-btn" onclick="showLocateTab('received')">Received</button>
    <button class="tab-btn" onclick="showLocateTab('raw')">Raw JSON</button>
  </div>
  <div id="locate-tab-sent" class="tab-panel active">
    <div id="locate-sent-content"><em>Not yet available</em></div>
  </div>
  <div id="locate-tab-received" class="tab-panel">
    <div id="locate-received-content"><em>Not yet available</em></div>
  </div>
  <div id="locate-tab-raw" class="tab-panel">
    <pre id="locate-raw-content">(not yet available)</pre>
  </div>
</div>

<div class="section" id="frames-section" style="display:none">
  <label>Extract frames <span id="frames-status-badge" class="node-waiting"></span><span id="frames-progress-msg" style="font-size:12px;color:#ffb020;margin-left:8px"></span></label>
  <div style="margin:6px 0">
    <button id="frames-btn" onclick="doExtractFrames()" disabled>Extract frames</button>
    <span id="frames-btn-reason" class="status" style="margin-left:8px"></span>
  </div>
  <div id="frames-manifest-content"></div>
</div>

<script>
const NODES = [
  {id:"upload",  label:"Upload & check"},
  {id:"locate",  label:"Locate (Gemini)"},
  {id:"frames",  label:"Extract frames"},
  {id:"verify",  label:"Verify (Gemini)"},
  {id:"confirm", label:"You confirm"},
  {id:"photos",  label:"Extra photos (Gemini)"},
  {id:"plan",    label:"Plan searches (LLM)"},
  {id:"search",  label:"Search web (Tavily)"},
  {id:"extract", label:"Read prices (LLM)"},
  {id:"pricing", label:"Price & report"},
];

let currentRunId = null;
let sseSource = null;
let locateNodeStatus = 'waiting';
let framesNodeStatus = 'waiting';
let framesIsRunning = false;

// Load config on start
fetch('/api/config').then(r => r.json()).then(cfg => {
  const u = cfg.upload;
  document.getElementById('limits').innerHTML =
    `allowed: <b>${u.allowed_types.join(', ')}</b> &nbsp; max size: <b>${u.max_size_mb} MB</b> &nbsp; max duration: <b>${Math.floor(u.max_duration_sec/60)}:${String(u.max_duration_sec%60).padStart(2,'0')}</b>`;
  document.getElementById('limits').className = 'status ok';
}).catch(e => {
  document.getElementById('limits').textContent = 'Error fetching /api/config: ' + e;
  document.getElementById('limits').className = 'status err';
});

// Enable upload button when file is selected
document.getElementById('file-input').addEventListener('change', function() {
  document.getElementById('upload-btn').disabled = !this.files.length;
});

function doUpload() {
  const fileInput = document.getElementById('file-input');
  if (!fileInput.files.length) return;
  const file = fileInput.files[0];

  const btn = document.getElementById('upload-btn');
  const status = document.getElementById('upload-status');
  const prog = document.getElementById('prog');
  btn.disabled = true;
  status.textContent = 'Uploading…';
  status.className = 'status';
  prog.style.width = '0%';

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/runs');

  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      const pct = Math.round(e.loaded / e.total * 100);
      prog.style.width = pct + '%';
      status.textContent = `Uploading… ${pct}%`;
    }
  };

  xhr.onload = function() {
    prog.style.width = '100%';
    try {
      const data = JSON.parse(xhr.responseText);
      if (xhr.status === 200 && data.run_id) {
        status.textContent = `Accepted. Run id: ${data.run_id}`;
        status.className = 'status ok';
        document.getElementById('run-id-display').textContent = data.run_id;
        loadRun(data.run_id);
      } else {
        const msg = data.error ? data.error.message : JSON.stringify(data);
        status.textContent = msg;
        status.className = 'status err';
        btn.disabled = false;
      }
    } catch(e) {
      status.textContent = 'Unexpected response: ' + xhr.responseText.slice(0, 200);
      status.className = 'status err';
      btn.disabled = false;
    }
  };

  xhr.onerror = function() {
    status.textContent = 'Network error.';
    status.className = 'status err';
    btn.disabled = false;
  };

  const fd = new FormData();
  fd.append('video', file);
  xhr.send(fd);
}

function loadRun(runId) {
  if (!runId) return;
  currentRunId = runId;
  locateNodeStatus = 'waiting';
  framesNodeStatus = 'waiting';
  framesIsRunning = false;
  document.getElementById('run-id-input').value = runId;
  document.getElementById('run-section').style.display = '';

  // Init node grid
  const grid = document.getElementById('node-grid');
  grid.innerHTML = NODES.map(n =>
    `<div class="node-cell node-waiting" id="node-${n.id}">${n.label}</div>`
  ).join('');

  // File links
  const links = document.getElementById('file-links');
  links.innerHTML = [
    {path:'meta.json', label:'meta.json'},
    {path:'events.jsonl', label:'events.jsonl'},
    {path:'01_locate/request.json', label:'01_locate/request.json'},
    {path:'01_locate/response.json', label:'01_locate/response.json'},
    {path:'02_frames/manifest.json', label:'02_frames/manifest.json'},
  ].map(f =>
    `<a class="file-link" href="/api/runs/${runId}/files/${f.path}" target="_blank">${f.label}</a>`
  ).join('');

  document.getElementById('locate-section').style.display = '';
  document.getElementById('frames-section').style.display = '';
  document.getElementById('frames-manifest-content').innerHTML = '';
  document.getElementById('frames-progress-msg').textContent = '';
  updateFramesButton();

  // Load meta.json
  fetch(`/api/runs/${runId}/files/meta.json`)
    .then(r => r.text())
    .then(t => {
      try { document.getElementById('meta-json').textContent = JSON.stringify(JSON.parse(t), null, 2); }
      catch { document.getElementById('meta-json').textContent = t; }
    })
    .catch(() => { document.getElementById('meta-json').textContent = '(not yet available)'; });

  // Load snapshot to get node statuses
  fetch(`/api/runs/${runId}`)
    .then(r => r.json())
    .then(d => {
      if (d.nodes) updateNodeStatuses(d.nodes);
      const ls = d.nodes && d.nodes['locate'];
      if (ls === 'done' || ls === 'failed') loadLocateFiles(runId);
      const fs = d.nodes && d.nodes['frames'];
      if (fs === 'done') loadFramesManifest(runId);
    })
    .catch(() => {});

  // Clear and open SSE stream
  document.getElementById('events-log').innerHTML = '';
  if (sseSource) { sseSource.close(); }
  sseSource = new EventSource(`/api/runs/${runId}/events`);
  sseSource.onmessage = function(e) {
    try {
      const ev = JSON.parse(e.data);
      addEventLine(ev);
      // Update node status from event
      if (ev.node && ev.type) {
        const statusMap = {
          node_started: 'running',
          node_done: 'done',
          node_failed: 'failed',
          node_skipped: 'skipped',
        };
        if (statusMap[ev.type]) {
          const cell = document.getElementById('node-' + ev.node);
          if (cell) {
            cell.className = 'node-cell node-' + statusMap[ev.type];
          }
        }
        if (ev.node === 'locate') {
          if (ev.type === 'node_progress') {
            document.getElementById('locate-progress-msg').textContent = ev.data.message || '';
          }
          if (ev.type === 'node_done' || ev.type === 'node_failed') {
            locateNodeStatus = ev.type === 'node_done' ? 'done' : 'failed';
            document.getElementById('locate-progress-msg').textContent = '';
            loadLocateFiles(currentRunId);
            updateFramesButton();
          }
        }
        if (ev.node === 'frames') {
          if (ev.type === 'node_started') {
            framesIsRunning = true;
            updateFramesButton();
          }
          if (ev.type === 'node_progress') {
            document.getElementById('frames-progress-msg').textContent = ev.data.message || '';
          }
          if (ev.type === 'node_done' || ev.type === 'node_failed' || ev.type === 'node_skipped') {
            framesIsRunning = false;
            framesNodeStatus = ev.type === 'node_done' ? 'done' : ev.type === 'node_failed' ? 'failed' : 'skipped';
            document.getElementById('frames-progress-msg').textContent = '';
            if (ev.type === 'node_done') loadFramesManifest(currentRunId);
            updateFramesButton();
          }
        }
      }
    } catch {}
  };
  sseSource.onerror = function() {
    addRawLine('[SSE disconnected or error]', 'warn');
  };
}

function updateNodeStatuses(nodes) {
  for (const [id, status] of Object.entries(nodes)) {
    const cell = document.getElementById('node-' + id);
    if (cell) cell.className = 'node-cell node-' + status;
    if (id === 'locate') locateNodeStatus = status;
    if (id === 'frames') { framesNodeStatus = status; framesIsRunning = (status === 'running'); }
  }
  updateFramesButton();
}

function addEventLine(ev) {
  const log = document.getElementById('events-log');
  const line = document.createElement('div');
  line.className = 'event-line';
  line.textContent = `[${ev.seq}] ${ev.ts} ${ev.node}/${ev.type} ${JSON.stringify(ev.data)}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function addRawLine(text, cls) {
  const log = document.getElementById('events-log');
  const line = document.createElement('div');
  line.className = 'event-line ' + (cls || '');
  line.textContent = text;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function showLocateTab(name) {
  ['sent','received','raw'].forEach(t => {
    document.getElementById('locate-tab-' + t).classList.toggle('active', t === name);
  });
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['sent','received','raw'][i] === name);
  });
}

function fmtT(t) {
  const m = Math.floor(t / 60), s = (t % 60).toFixed(1);
  return m + ':' + s.padStart(4, '0');
}

function loadLocateFiles(runId) {
  fetch(`/api/runs/${runId}/files/01_locate/request.json`)
    .then(r => r.json()).then(req => {
      const cfg = req.settings || {};
      let html = `<b>Model:</b> ${req.model}<br>`;
      html += `<b>Media resolution:</b> ${cfg.media_resolution || '-'} &nbsp; <b>Temperature:</b> ${cfg.temperature ?? '-'} &nbsp; <b>Thinking:</b> ${cfg.thinking_level || 'default'}<br>`;
      if (req.media && req.media[0]) {
        const m = req.media[0];
        html += `<b>Sent file:</b> ${m.file || m.source_file || '?'} (${m.size_mb != null ? m.size_mb + ' MB' : '?'})<br>`;
        html += `<b>Gemini file:</b> ${m.gemini_file || '(pending)'}<br>`;
      }
      html += `<br><b>System prompt:</b><pre>${escHtml(req.system_prompt || '')}</pre>`;
      html += `<b>User prompt:</b><pre>${escHtml(req.user_prompt || '')}</pre>`;
      document.getElementById('locate-sent-content').innerHTML = html;
    }).catch(() => {});

  fetch(`/api/runs/${runId}/files/01_locate/response.json`)
    .then(r => r.json()).then(res => {
      document.getElementById('locate-raw-content').textContent = JSON.stringify(res, null, 2);
      const p = res.parsed;
      if (!p) {
        document.getElementById('locate-received-content').innerHTML =
          `<span class="err">Parse failed.</span><pre>${escHtml(res.raw_text || '')}</pre>`;
        return;
      }
      const tok = res.tokens || {};
      let html = `<b>Tokens:</b> ${tok.input || 0} in / ${tok.output || 0} out &nbsp; <b>Duration:</b> ${(res.duration_ms/1000).toFixed(1)}s<br><br>`;
      html += '<table><tr><th>ID</th><th>Category</th><th>Label</th><th>Side</th><th>t</th><th>t_text</th></tr>';
      for (const it of (p.items || [])) {
        html += `<tr><td>${escHtml(it.id)}</td><td>${escHtml(it.category)}</td><td>${escHtml(it.label)}</td><td>${escHtml(it.side)}</td><td>${fmtT(it.t)}</td><td>${it.t_text ? escHtml(it.t_text) : ''}</td></tr>`;
      }
      html += '</table><br><b>Coverage:</b> ';
      const cov = p.coverage || {};
      html += Object.entries(cov).filter(([,v])=>v).map(([k])=>k).join(', ') || 'none';
      document.getElementById('locate-received-content').innerHTML = html;
    }).catch(() => {});
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateFramesButton() {
  const btn = document.getElementById('frames-btn');
  const reason = document.getElementById('frames-btn-reason');
  if (!btn) return;
  if (locateNodeStatus !== 'done') {
    btn.disabled = true;
    btn.textContent = 'Extract frames';
    reason.textContent = 'Locate has no result for this run';
    return;
  }
  if (framesIsRunning) {
    btn.disabled = true;
    btn.textContent = 'Extract frames';
    reason.textContent = 'Running…';
    return;
  }
  btn.disabled = false;
  btn.textContent = (framesNodeStatus === 'done' || framesNodeStatus === 'failed')
    ? 'Re-run extract frames' : 'Extract frames';
  reason.textContent = '';
}

function doExtractFrames() {
  if (!currentRunId) return;
  document.getElementById('frames-btn').disabled = true;
  document.getElementById('frames-btn-reason').textContent = 'Starting…';
  fetch('/api/runs/' + currentRunId + '/frames', {method: 'POST'})
    .then(r => r.json().then(d => ({ok: r.ok, data: d})))
    .then(({ok, data}) => {
      if (!ok) {
        const msg = data.error ? data.error.message : JSON.stringify(data);
        document.getElementById('frames-btn-reason').textContent = msg;
        updateFramesButton();
      }
    })
    .catch(e => {
      document.getElementById('frames-btn-reason').textContent = 'Error: ' + e;
      updateFramesButton();
    });
}

function loadFramesManifest(runId) {
  fetch('/api/runs/' + runId + '/files/02_frames/manifest.json')
    .then(r => r.json())
    .then(manifest => renderFramesManifest(runId, manifest))
    .catch(() => {});
}

function renderFramesManifest(runId, manifest) {
  const t = manifest.totals || {};
  let html = '<div style="color:#aaa;font-size:12px;margin-bottom:8px">'
    + (t.items || 0) + ' items &nbsp; '
    + (t.frames_extracted || 0) + ' frames scored &nbsp; '
    + (t.elapsed_s || 0) + ' s &nbsp; '
    + (t.workers || 0) + ' threads'
    + '</div>';
  html += '<table><tr><th>Item</th><th>Category</th><th>Time</th><th>Frames</th>'
    + '<th>Seek</th><th>Decode</th><th>Score</th><th>Total</th>'
    + '<th>Best t</th><th>Sharpness</th><th>Image</th></tr>';
  for (const item of (manifest.items || [])) {
    if (item.skipped) {
      html += '<tr><td>' + escHtml(item.item_id) + '</td><td>' + escHtml(item.category || '') + '</td>'
        + '<td>' + escHtml(item.t_text || '') + '</td>'
        + '<td colspan="8"><span class="warn">Skipped: ' + escHtml(item.skipped) + '</span></td></tr>';
      continue;
    }
    const tm = item.timings_s || {};
    const best = item.sharpest || {};
    const imgPath = '02_frames/' + encodeURIComponent(best.file || '');
    const imgUrl = '/api/runs/' + runId + '/files/' + imgPath;
    html += '<tr>'
      + '<td>' + escHtml(item.item_id) + '</td>'
      + '<td>' + escHtml(item.category || '') + '</td>'
      + '<td>' + escHtml(item.t_text || '') + '</td>'
      + '<td>' + (item.frames_extracted || 0) + '</td>'
      + '<td>' + (tm.seek || 0).toFixed(2) + '</td>'
      + '<td>' + (tm.decode || 0).toFixed(2) + '</td>'
      + '<td>' + (tm.score || 0).toFixed(2) + '</td>'
      + '<td>' + (tm.total || 0).toFixed(2) + '</td>'
      + '<td>' + (best.t || 0).toFixed(3) + '</td>'
      + '<td>' + (best.sharpness || 0).toFixed(0) + '</td>'
      + '<td><img src="' + imgUrl + '" class="frames-thumb" '
      + 'onclick="window.open(\'' + imgUrl + '\',\'_blank\')" loading="lazy"></td>'
      + '</tr>';
  }
  html += '</table>';
  document.getElementById('frames-manifest-content').innerHTML = html;
}

// Auto-load run from ?run= URL param
(function() {
  const params = new URLSearchParams(location.search);
  const rid = params.get('run');
  if (rid) loadRun(rid);
})();
</script>
</body>
</html>
