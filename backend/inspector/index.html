<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarLens Inspector</title>
<style>
  body { font-family: monospace; background: #111; color: #ddd; margin: 0; padding: 16px; }
  h1 { color: #fff; margin: 0 0 8px; font-size: 18px; }
  .section { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 12px; margin: 12px 0; }
  label { display: block; margin-bottom: 4px; color: #aaa; font-size: 12px; }
  input[type=text], input[type=file] { background: #222; color: #eee; border: 1px solid #444; padding: 6px 8px; border-radius: 3px; width: 100%; box-sizing: border-box; font-family: monospace; }
  button { background: #2a5caa; color: #fff; border: none; padding: 8px 16px; border-radius: 3px; cursor: pointer; font-family: monospace; }
  button:hover { background: #3a6cbf; }
  button:disabled { background: #444; cursor: default; }
  .status { font-size: 12px; color: #aaa; margin-top: 6px; }
  .ok { color: #6f9; }
  .err { color: #f66; }
  .warn { color: #fb0; }
  .progress-bar { background: #333; border-radius: 2px; height: 6px; margin: 6px 0; }
  .progress-fill { background: #8fd5b5; height: 6px; border-radius: 2px; width: 0; transition: width 0.2s; }
  #events-log { max-height: 300px; overflow-y: auto; font-size: 11px; }
  .event-line { border-bottom: 1px solid #222; padding: 3px 0; }
  .node-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 11px; }
  .node-cell { background: #222; border-radius: 2px; padding: 4px 6px; text-align: center; }
  .node-waiting { opacity: 0.5; }
  .node-running { border: 1px solid #ffb020; color: #ffb020; }
  .node-done { border: 1px solid #8fd5b5; color: #8fd5b5; }
  .cf-row { display: grid; grid-template-columns: 90px 260px 1fr; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
  .cf-row input, .cf-row select { background: #111; color: #eee; border: 1px solid #444; padding: 4px 6px; font-family: monospace; }
  .cf-flag input, .cf-flag select { border-color: #ffb020; }
  .chip { display: inline-block; background: #2a2a2a; border: 1px solid #555; border-radius: 10px; padding: 1px 8px; margin: 0 4px 2px 0; cursor: pointer; font-size: 12px; }
  .chip:hover { border-color: #a08fd6; }
  .cf-note { background: #222; border-left: 3px solid #ffb020; padding: 6px 8px; margin: 6px 0; font-size: 13px; }
  .node-failed { border: 1px solid #e5484d; color: #e5484d; }
  .node-skipped { opacity: 0.4; text-decoration: line-through; }
  pre { background: #0a0a0a; padding: 10px; border-radius: 3px; overflow-x: auto; font-size: 11px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .file-link { color: #6af; text-decoration: none; font-size: 12px; margin-right: 12px; }
  .file-link:hover { text-decoration: underline; }
  #run-id-display { color: #8fd5b5; font-size: 13px; margin-top: 6px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tab-btn { background: #222; color: #aaa; border: 1px solid #444; padding: 4px 10px; border-radius: 3px 3px 0 0; cursor: pointer; font-family: monospace; font-size: 12px; }
  .tab-btn.active { background: #1a1a1a; color: #eee; border-bottom-color: #1a1a1a; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  table { border-collapse: collapse; width: 100%; font-size: 11px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #2a2a2a; }
  th { color: #aaa; }
  .locate-progress { font-size: 12px; color: #ffb020; margin-left: 8px; }
  .frames-thumb { max-height: 60px; cursor: pointer; border-radius: 2px; vertical-align: middle; }
  .frames-thumb:hover { opacity: 0.8; }
</style>
</head>
<body>
<h1>CarLens Inspector <span style="color:#555;font-size:12px">dev tool</span></h1>

<div class="section">
  <label>Upload limits (from /api/config)</label>
  <div id="limits" class="status">loading…</div>
</div>

<div class="section">
  <label>Pick a video and upload</label>
  <input type="file" id="file-input" accept="video/*">
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <div id="upload-status" class="status"></div>
  <button id="upload-btn" onclick="doUpload()" disabled>Upload</button>
  <div id="run-id-display"></div>
</div>

<div class="section">
  <label>Inspect a run (paste run id or use ?run=… in URL)</label>
  <input type="text" id="run-id-input" placeholder="r_YYYYMMDD_HHMMSS_xxxx">
  <button onclick="loadRun(document.getElementById('run-id-input').value.trim())" style="margin-top:6px">Load run</button>
</div>

<div class="section" id="run-section" style="display:none">
  <label>Node statuses</label>
  <div class="node-grid" id="node-grid"></div>

  <label style="margin-top:12px">Run files</label>
  <div id="file-links"></div>

  <label style="margin-top:12px">meta.json</label>
  <pre id="meta-json">(loading…)</pre>

  <label style="margin-top:12px">Live events</label>
  <div id="events-log"></div>
</div>

<div class="section" id="locate-section" style="display:none">
  <label>Locate (Gemini) <span id="locate-status-badge" class="node-waiting"></span><span class="locate-progress" id="locate-progress-msg"></span></label>
  <div class="tabs">
    <button class="tab-btn active" onclick="showLocateTab('sent')">Sent</button>
    <button class="tab-btn" onclick="showLocateTab('received')">Received</button>
    <button class="tab-btn" onclick="showLocateTab('raw')">Raw JSON</button>
  </div>
  <div id="locate-tab-sent" class="tab-panel active">
    <div id="locate-sent-content"><em>Not yet available</em></div>
  </div>
  <div id="locate-tab-received" class="tab-panel">
    <div id="locate-received-content"><em>Not yet available</em></div>
  </div>
  <div id="locate-tab-raw" class="tab-panel">
    <pre id="locate-raw-content">(not yet available)</pre>
  </div>
</div>

<div class="section" id="frames-section" style="display:none">
  <label>Extract frames <span id="frames-status-badge" class="node-waiting"></span><span id="frames-progress-msg" style="font-size:12px;color:#ffb020;margin-left:8px"></span></label>
  <div style="margin:6px 0">
    <button id="frames-btn" onclick="doExtractFrames()" disabled>Extract frames</button>
    <span id="frames-btn-reason" class="status" style="margin-left:8px"></span>
  </div>
  <div id="frames-manifest-content"></div>
</div>

<div class="section" id="verify-section" style="display:none">
  <label>Verify (AI) <span id="verify-status-badge" class="node-waiting"></span><span id="verify-progress-msg" style="font-size:12px;color:#ffb020;margin-left:8px"></span></label>
  <div style="margin:6px 0">
    <button id="verify-btn" onclick="doRunVerify()" disabled>Run verify</button>
    <span id="verify-btn-reason" class="status" style="margin-left:8px"></span>
  </div>
  <div id="verify-content"></div>
</div>

<div class="section" id="confirm-section" style="display:none">
  <label>You confirm</label>
  <div style="margin:6px 0">
    <button id="confirm-start-btn" onclick="doStartConfirm()" disabled>Start confirm</button>
    <span id="confirm-btn-reason" class="status" style="margin-left:8px"></span>
  </div>
  <div id="confirm-content"></div>
</div>

<div class="section" id="plan-section" style="display:none">
  <label>Plan searches <span id="plan-progress-msg" style="font-size:12px;color:#ffb020;margin-left:8px"></span></label>
  <div style="margin:6px 0">
    <button id="plan-btn" onclick="doRunPlan()" disabled>Generate queries</button>
    <span id="plan-btn-reason" class="status" style="margin-left:8px"></span>
  </div>
  <div id="plan-content"></div>
</div>

<div class="section" id="search-section" style="display:none">
  <label>Search web (Tavily) <span id="search-progress-msg" style="font-size:12px;color:#ffb020;margin-left:8px"></span></label>
  <div style="margin:6px 0">
    <button id="search-btn" onclick="doRunSearch()" disabled>Run search</button>
    <span id="search-btn-reason" class="status" style="margin-left:8px"></span>
  </div>
  <div id="search-content"></div>
</div>

<script>
const NODES = [
  {id:"upload",  label:"Upload & check"},
  {id:"locate",  label:"Locate (Gemini)"},
  {id:"frames",  label:"Extract frames"},
  {id:"verify",  label:"Verify (AI)"},
  {id:"confirm", label:"You confirm"},
  {id:"photos",  label:"Extra photos (Gemini)"},
  {id:"plan",    label:"Plan searches (LLM)"},
  {id:"search",  label:"Search web (Tavily)"},
  {id:"extract", label:"Read prices (LLM)"},
  {id:"pricing", label:"Price & report"},
];

let currentRunId = null;
let sseSource = null;
let locateNodeStatus = 'waiting';
let framesNodeStatus = 'waiting';
let framesIsRunning = false;
let verifyNodeStatus = 'waiting';
let verifyIsRunning = false;
let confirmPayload = null;
let confirmDone = false;
let planNodeStatus = 'waiting';
let planIsRunning = false;
let searchNodeStatus = 'waiting';
let searchIsRunning = false;

// Load config on start
fetch('/api/config').then(r => r.json()).then(cfg => {
  const u = cfg.upload;
  document.getElementById('limits').innerHTML =
    `allowed: <b>${u.allowed_types.join(', ')}</b> &nbsp; max size: <b>${u.max_size_mb} MB</b> &nbsp; max duration: <b>${Math.floor(u.max_duration_sec/60)}:${String(u.max_duration_sec%60).padStart(2,'0')}</b>`;
  document.getElementById('limits').className = 'status ok';
}).catch(e => {
  document.getElementById('limits').textContent = 'Error fetching /api/config: ' + e;
  document.getElementById('limits').className = 'status err';
});

// Enable upload button when file is selected
document.getElementById('file-input').addEventListener('change', function() {
  document.getElementById('upload-btn').disabled = !this.files.length;
});

function doUpload() {
  const fileInput = document.getElementById('file-input');
  if (!fileInput.files.length) return;
  const file = fileInput.files[0];

  const btn = document.getElementById('upload-btn');
  const status = document.getElementById('upload-status');
  const prog = document.getElementById('prog');
  btn.disabled = true;
  status.textContent = 'Uploading…';
  status.className = 'status';
  prog.style.width = '0%';

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/runs');

  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      const pct = Math.round(e.loaded / e.total * 100);
      prog.style.width = pct + '%';
      status.textContent = `Uploading… ${pct}%`;
    }
  };

  xhr.onload = function() {
    prog.style.width = '100%';
    try {
      const data = JSON.parse(xhr.responseText);
      if (xhr.status === 200 && data.run_id) {
        status.textContent = `Accepted. Run id: ${data.run_id}`;
        status.className = 'status ok';
        document.getElementById('run-id-display').textContent = data.run_id;
        loadRun(data.run_id);
      } else {
        const msg = data.error ? data.error.message : JSON.stringify(data);
        status.textContent = msg;
        status.className = 'status err';
        btn.disabled = false;
      }
    } catch(e) {
      status.textContent = 'Unexpected response: ' + xhr.responseText.slice(0, 200);
      status.className = 'status err';
      btn.disabled = false;
    }
  };

  xhr.onerror = function() {
    status.textContent = 'Network error.';
    status.className = 'status err';
    btn.disabled = false;
  };

  const fd = new FormData();
  fd.append('video', file);
  xhr.send(fd);
}

function loadRun(runId) {
  if (!runId) return;
  currentRunId = runId;
  locateNodeStatus = 'waiting';
  framesNodeStatus = 'waiting';
  framesIsRunning = false;
  verifyNodeStatus = 'waiting';
  verifyIsRunning = false;
  confirmPayload = null;
  confirmDone = false;
  planNodeStatus = 'waiting';
  planIsRunning = false;
  searchNodeStatus = 'waiting';
  searchIsRunning = false;
  document.getElementById('run-id-input').value = runId;
  document.getElementById('run-section').style.display = '';

  // Init node grid
  const grid = document.getElementById('node-grid');
  grid.innerHTML = NODES.map(n =>
    `<div class="node-cell node-waiting" id="node-${n.id}">${n.label}</div>`
  ).join('');

  // File links
  const links = document.getElementById('file-links');
  links.innerHTML = [
    {path:'meta.json', label:'meta.json'},
    {path:'events.jsonl', label:'events.jsonl'},
    {path:'01_locate/request.json', label:'01_locate/request.json'},
    {path:'01_locate/response.json', label:'01_locate/response.json'},
    {path:'02_frames/manifest.json', label:'02_frames/manifest.json'},
    {path:'03_verify/ocr.json', label:'03_verify/ocr.json'},
    {path:'03_verify/request.json', label:'03_verify/request.json'},
    {path:'03_verify/response.json', label:'03_verify/response.json'},
    {path:'04_confirm_payload.json', label:'04_confirm_payload.json'},
    {path:'04_confirm.json', label:'04_confirm.json'},
    {path:'06_plan/request.json', label:'06_plan/request.json'},
    {path:'06_plan/response.json', label:'06_plan/response.json'},
    {path:'06_plan/queries.json', label:'06_plan/queries.json'},
    {path:'07_search/results.json', label:'07_search/results.json'},
  ].map(f =>
    `<a class="file-link" href="/api/runs/${runId}/files/${f.path}" target="_blank">${f.label}</a>`
  ).join('');

  document.getElementById('locate-section').style.display = '';
  document.getElementById('frames-section').style.display = '';
  document.getElementById('frames-manifest-content').innerHTML = '';
  document.getElementById('frames-progress-msg').textContent = '';
  document.getElementById('verify-section').style.display = '';
  document.getElementById('verify-content').innerHTML = '';
  document.getElementById('verify-progress-msg').textContent = '';
  document.getElementById('confirm-section').style.display = '';
  document.getElementById('confirm-content').innerHTML = '';
  document.getElementById('plan-section').style.display = '';
  document.getElementById('plan-content').innerHTML = '';
  document.getElementById('plan-progress-msg').textContent = '';
  document.getElementById('search-section').style.display = '';
  document.getElementById('search-content').innerHTML = '';
  document.getElementById('search-progress-msg').textContent = '';
  updatePlanButton();
  updateSearchButton();
  updateFramesButton();
  updateVerifyButton();
  updateConfirmButton();

  // Load meta.json
  fetch(`/api/runs/${runId}/files/meta.json`)
    .then(r => r.text())
    .then(t => {
      try { document.getElementById('meta-json').textContent = JSON.stringify(JSON.parse(t), null, 2); }
      catch { document.getElementById('meta-json').textContent = t; }
    })
    .catch(() => { document.getElementById('meta-json').textContent = '(not yet available)'; });

  // Load snapshot to get node statuses
  fetch(`/api/runs/${runId}`)
    .then(r => r.json())
    .then(d => {
      if (d.nodes) updateNodeStatuses(d.nodes);
      const ls = d.nodes && d.nodes['locate'];
      if (ls === 'done' || ls === 'failed') loadLocateFiles(runId);
      const fs = d.nodes && d.nodes['frames'];
      if (fs === 'done') loadFramesManifest(runId);
      const vs = d.nodes && d.nodes['verify'];
      if (vs === 'done' || vs === 'failed' || vs === 'skipped') loadVerifyFiles(runId);
    })
    .catch(() => {});

  // Clear and open SSE stream
  document.getElementById('events-log').innerHTML = '';
  if (sseSource) { sseSource.close(); }
  sseSource = new EventSource(`/api/runs/${runId}/events`);
  sseSource.onmessage = function(e) {
    try {
      const ev = JSON.parse(e.data);
      addEventLine(ev);
      // Update node status from event
      if (ev.node && ev.type) {
        const statusMap = {
          node_started: 'running',
          node_done: 'done',
          node_failed: 'failed',
          node_skipped: 'skipped',
        };
        if (statusMap[ev.type]) {
          const cell = document.getElementById('node-' + ev.node);
          if (cell) {
            cell.className = 'node-cell node-' + statusMap[ev.type];
          }
        }
        if (ev.node === 'locate') {
          if (ev.type === 'node_progress') {
            document.getElementById('locate-progress-msg').textContent = ev.data.message || '';
          }
          if (ev.type === 'node_done' || ev.type === 'node_failed') {
            locateNodeStatus = ev.type === 'node_done' ? 'done' : 'failed';
            document.getElementById('locate-progress-msg').textContent = '';
            loadLocateFiles(currentRunId);
            updateFramesButton();
          }
        }
        if (ev.node === 'frames') {
          if (ev.type === 'node_started') {
            framesIsRunning = true;
            updateFramesButton();
          }
          if (ev.type === 'node_progress') {
            document.getElementById('frames-progress-msg').textContent = ev.data.message || '';
          }
          if (ev.type === 'node_done' || ev.type === 'node_failed' || ev.type === 'node_skipped') {
            framesIsRunning = false;
            framesNodeStatus = ev.type === 'node_done' ? 'done' : ev.type === 'node_failed' ? 'failed' : 'skipped';
            document.getElementById('frames-progress-msg').textContent = '';
            if (ev.type === 'node_done') loadFramesManifest(currentRunId);
            updateFramesButton();
            updateVerifyButton();
          }
        }
        if (ev.node === 'verify') {
          if (ev.type === 'node_started') { verifyIsRunning = true; updateVerifyButton(); }
          if (ev.type === 'node_progress') {
            document.getElementById('verify-progress-msg').textContent = ev.data.message || '';
          }
          if (ev.type === 'node_done' || ev.type === 'node_failed' || ev.type === 'node_skipped') {
            verifyIsRunning = false;
            verifyNodeStatus = ev.type === 'node_done' ? 'done' : ev.type === 'node_failed' ? 'failed' : 'skipped';
            document.getElementById('verify-progress-msg').textContent = '';
            loadVerifyFiles(currentRunId);
            updateVerifyButton();
            updateConfirmButton();
          }
        }
        if (ev.node === 'confirm') {
          if (ev.type === 'awaiting_confirm') { confirmPayload = ev.data; confirmDone = false; renderConfirmForm(); }
          if (ev.type === 'node_done') { confirmDone = true; loadConfirmRecord(currentRunId); }
          if (ev.type === 'node_skipped') { document.getElementById('confirm-content').innerHTML = '<em>Skipped: ' + escHtml(ev.data.reason || '') + '</em>'; }
          updateConfirmButton();
          updatePlanButton();
        }
        if (ev.node === 'plan') {
          if (ev.type === 'node_started') { planIsRunning = true; document.getElementById('plan-content').innerHTML = ''; }
          if (ev.type === 'node_progress') document.getElementById('plan-progress-msg').textContent = ev.data.message || '';
          if (ev.type === 'node_done' || ev.type === 'node_failed' || ev.type === 'node_skipped') {
            planIsRunning = false;
            planNodeStatus = ev.type === 'node_done' ? 'done' : ev.type === 'node_failed' ? 'failed' : 'skipped';
            document.getElementById('plan-progress-msg').textContent = '';
            loadPlanFiles(currentRunId, ev);
          }
          updatePlanButton();
          updateSearchButton();
        }
        if (ev.node === 'search') {
          if (ev.type === 'node_started') { searchIsRunning = true; document.getElementById('search-content').innerHTML = ''; }
          if (ev.type === 'node_progress') document.getElementById('search-progress-msg').textContent = ev.data.message || '';
          if (ev.type === 'node_done' || ev.type === 'node_failed' || ev.type === 'node_skipped') {
            searchIsRunning = false;
            searchNodeStatus = ev.type === 'node_done' ? 'done' : ev.type === 'node_failed' ? 'failed' : 'skipped';
            document.getElementById('search-progress-msg').textContent = '';
            loadSearchResults(currentRunId, ev);
          }
          updateSearchButton();
        }
      }
    } catch {}
  };
  sseSource.onerror = function() {
    addRawLine('[SSE disconnected or error]', 'warn');
  };
}

function updateNodeStatuses(nodes) {
  for (const [id, status] of Object.entries(nodes)) {
    const cell = document.getElementById('node-' + id);
    if (cell) cell.className = 'node-cell node-' + status;
    if (id === 'locate') locateNodeStatus = status;
    if (id === 'frames') { framesNodeStatus = status; framesIsRunning = (status === 'running'); }
    if (id === 'verify') { verifyNodeStatus = status; verifyIsRunning = (status === 'running'); }
  }
  updateFramesButton();
  updateVerifyButton();
}

function addEventLine(ev) {
  const log = document.getElementById('events-log');
  const line = document.createElement('div');
  line.className = 'event-line';
  line.textContent = `[${ev.seq}] ${ev.ts} ${ev.node}/${ev.type} ${JSON.stringify(ev.data)}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function addRawLine(text, cls) {
  const log = document.getElementById('events-log');
  const line = document.createElement('div');
  line.className = 'event-line ' + (cls || '');
  line.textContent = text;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function showLocateTab(name) {
  ['sent','received','raw'].forEach(t => {
    document.getElementById('locate-tab-' + t).classList.toggle('active', t === name);
  });
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['sent','received','raw'][i] === name);
  });
}

function fmtT(t) {
  const m = Math.floor(t / 60), s = (t % 60).toFixed(1);
  return m + ':' + s.padStart(4, '0');
}

function loadLocateFiles(runId) {
  fetch(`/api/runs/${runId}/files/01_locate/request.json`)
    .then(r => r.json()).then(req => {
      const cfg = req.settings || {};
      let html = `<b>Model:</b> ${req.model}<br>`;
      html += `<b>Media resolution:</b> ${cfg.media_resolution || '-'} &nbsp; <b>Temperature:</b> ${cfg.temperature ?? '-'} &nbsp; <b>Thinking:</b> ${cfg.thinking_level || 'default'}<br>`;
      if (req.media && req.media[0]) {
        const m = req.media[0];
        html += `<b>Sent file:</b> ${m.file || m.source_file || '?'} (${m.size_mb != null ? m.size_mb + ' MB' : '?'})<br>`;
        html += `<b>Gemini file:</b> ${m.gemini_file || '(pending)'}<br>`;
      }
      html += `<br><b>System prompt:</b><pre>${escHtml(req.system_prompt || '')}</pre>`;
      html += `<b>User prompt:</b><pre>${escHtml(req.user_prompt || '')}</pre>`;
      document.getElementById('locate-sent-content').innerHTML = html;
    }).catch(() => {});

  fetch(`/api/runs/${runId}/files/01_locate/response.json`)
    .then(r => r.json()).then(res => {
      document.getElementById('locate-raw-content').textContent = JSON.stringify(res, null, 2);
      const p = res.parsed;
      if (!p) {
        document.getElementById('locate-received-content').innerHTML =
          `<span class="err">Parse failed.</span><pre>${escHtml(res.raw_text || '')}</pre>`;
        return;
      }
      const tok = res.tokens || {};
      let html = `<b>Tokens:</b> ${tok.input || 0} in / ${tok.output || 0} out &nbsp; <b>Duration:</b> ${(res.duration_ms/1000).toFixed(1)}s<br><br>`;
      html += '<table><tr><th>ID</th><th>Category</th><th>Label</th><th>Side</th><th>t</th><th>t_text</th></tr>';
      for (const it of (p.items || [])) {
        html += `<tr><td>${escHtml(it.id)}</td><td>${escHtml(it.category)}</td><td>${escHtml(it.label)}</td><td>${escHtml(it.side)}</td><td>${fmtT(it.t)}</td><td>${it.t_text ? escHtml(it.t_text) : ''}</td></tr>`;
      }
      html += '</table><br><b>Coverage:</b> ';
      const cov = p.coverage || {};
      html += Object.entries(cov).filter(([,v])=>v).map(([k])=>k).join(', ') || 'none';
      document.getElementById('locate-received-content').innerHTML = html;
    }).catch(() => {});
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderFramesManifest(runId, manifest) {
  const t = manifest.totals || {};
  let html = '<div style="color:#aaa;font-size:12px;margin-bottom:8px">'
    + (t.items || 0) + ' items &nbsp; '
    + (t.frames_extracted || 0) + ' frames scored &nbsp; '
    + (t.elapsed_s || 0) + ' s &nbsp; '
    + (t.workers || 0) + ' threads'
    + '</div>';
  html += '<table><tr><th>Item</th><th>Category</th><th>Time</th><th>Frames</th>'
    + '<th>Seek</th><th>Decode</th><th>Score</th><th>Total</th>'
    + '<th>Best t</th><th>Sharpness</th><th>Image</th></tr>';
  for (const item of (manifest.items || [])) {
    if (item.skipped) {
      html += '<tr><td>' + escHtml(item.item_id) + '</td><td>' + escHtml(item.category || '') + '</td>'
        + '<td>' + escHtml(item.t_text || '') + '</td>'
        + '<td colspan="8"><span class="warn">Skipped: ' + escHtml(item.skipped) + '</span></td></tr>';
      continue;
    }
    const tm = item.timings_s || {};
    const best = item.sharpest || {};
    const imgPath = '02_frames/' + encodeURIComponent(best.file || '');
    const imgUrl = '/api/runs/' + runId + '/files/' + imgPath;
    html += '<tr>'
      + '<td>' + escHtml(item.item_id) + '</td>'
      + '<td>' + escHtml(item.category || '') + '</td>'
      + '<td>' + escHtml(item.t_text || '') + '</td>'
      + '<td>' + (item.frames_extracted || 0) + '</td>'
      + '<td>' + (tm.seek || 0).toFixed(2) + '</td>'
      + '<td>' + (tm.decode || 0).toFixed(2) + '</td>'
      + '<td>' + (tm.score || 0).toFixed(2) + '</td>'
      + '<td>' + (tm.total || 0).toFixed(2) + '</td>'
      + '<td>' + (best.t || 0).toFixed(3) + '</td>'
      + '<td>' + (best.sharpness || 0).toFixed(0) + '</td>'
      + '<td><img src="' + imgUrl + '" class="frames-thumb" '
      + 'onclick="window.open(\'' + imgUrl + '\',\'_blank\')" loading="lazy"></td>'
      + '</tr>';
  }
  html += '</table>';
  document.getElementById('frames-manifest-content').innerHTML = html;
}

function renderVerifyContent(runId, ocr, req, res) {
  const parsed = res && res.parsed;
  let html = '<div class="tabs">'
    + ['plate','attempts','findings','read','sent'].map((t, i) =>
        `<button class="tab-btn${i===0?' active':''}" onclick="showVerifyTab('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`
      ).join('')
    + '</div>';

  // Plate tab
  html += '<div id="verify-tab-plate" class="tab-panel active">';
  if (ocr) {
    const p = ocr.plate;
    if (p) {
      html += `<b>Plate:</b> ${escHtml(p.text)} &nbsp; <b>Source:</b> OCR &nbsp; `
        + `<b>Confidence:</b> ${p.confidence} &nbsp; `
        + `<b>Agree:</b> ${p.frames_agree}/${p.frames_tried} frames<br><br>`;
    } else {
      html += '<span class="warn">No plate found by OCR.</span><br><br>';
    }
    html += '<table><tr><th>Item</th><th>File</th><th>Seconds</th><th>Texts found</th><th>Plates</th></tr>';
    for (const f of (ocr.frames || [])) {
      const texts = (f.texts || []).map(t => `${escHtml(t.text)} (${t.score})`).join(', ') || '—';
      html += `<tr><td>${escHtml(f.item_id)}</td><td>${escHtml(f.file)}</td><td>${f.seconds}</td>`
        + `<td>${texts}</td><td>${(f.plates||[]).map(escHtml).join(', ')||'—'}</td></tr>`;
    }
    html += '</table>';
  } else { html += '<em>ocr.json not available</em>'; }
  html += '</div>';

  // Attempts tab
  html += '<div id="verify-tab-attempts" class="tab-panel">';
  if (res && res.attempts) {
    html += '<table><tr><th>Provider</th><th>Model</th><th>Seconds</th><th>Tokens in/out/reasoning</th><th>Error</th></tr>';
    for (const a of res.attempts) {
      const tk = a.tokens || {};
      html += `<tr><td>${escHtml(a.provider)}</td><td>${escHtml(a.model)}</td><td>${a.seconds}</td>`
        + `<td>${tk.input||0} / ${tk.output||0} / ${tk.reasoning||0}</td>`
        + `<td>${a.error ? `<span class="err">${escHtml(a.error.slice(0,120))}</span>` : '<span class="ok">ok</span>'}</td></tr>`;
    }
    html += '</table>';
  } else { html += '<em>No attempts data.</em>'; }
  html += '</div>';

  // Findings tab
  html += '<div id="verify-tab-findings" class="tab-panel">';
  if (parsed && parsed.findings) {
    html += '<table><tr><th>Item</th><th>Thumb</th><th>Confirmed</th><th>Part</th><th>Issue</th>'
      + '<th>Severity</th><th>Action</th><th>Description / Reason</th><th>Tyre</th></tr>';
    for (const f of parsed.findings) {
      const imgPath = f.best_frame ? '02_frames/' + encodeURIComponent(f.best_frame) : null;
      const imgUrl = imgPath ? '/api/runs/' + runId + '/files/' + imgPath : '';
      const thumb = imgUrl ? `<img src="${imgUrl}" class="frames-thumb" onclick="window.open('${imgUrl}','_blank')" loading="lazy">` : '—';
      const tyre = f.tyre ? `${f.tyre.position||'?'} s${f.tyre.tyre_score??'?'} ${f.tyre.tread||'?'}` : '';
      html += `<tr><td>${escHtml(f.item_id)}</td><td>${thumb}</td>`
        + `<td>${f.confirmed ? '<span class="ok">yes</span>' : '<span class="err">no</span>'}</td>`
        + `<td>${escHtml(f.part||'')}</td><td>${escHtml(f.issue||'')}</td>`
        + `<td>${escHtml(f.severity||'')}</td><td>${escHtml(f.action||'')}</td>`
        + `<td>${escHtml(f.description||f.reason||'')}</td><td>${escHtml(tyre)}</td></tr>`;
    }
    html += '</table>';
  } else { html += '<em>No findings.</em>'; }
  html += '</div>';

  // Read tab
  html += '<div id="verify-tab-read" class="tab-panel">';
  if (parsed) {
    const plate = parsed.plate || {};
    const badge = parsed.badge || {};
    const odo = parsed.odometer_km || {};
    const v = parsed.vehicle || {};
    html += `<b>Plate:</b> ${escHtml(plate.text||'—')} <span style="color:#aaa">(${escHtml(plate.source||'—')}, conf ${plate.confidence??'—'})</span><br>`;
    html += `<b>Badge:</b> ${escHtml(badge.text||'—')} <span style="color:#aaa">(conf ${badge.confidence??'—'})</span><br>`;
    html += `<b>Odometer:</b> ${odo.value??'—'} km <span style="color:#aaa">(conf ${odo.confidence??'—'})</span><br>`;
    html += `<b>Tyres assessed:</b> ${parsed.tyres_assessed} &nbsp; <b>Odometer found:</b> ${parsed.odometer_found}<br><br>`;
    html += '<table><tr><th>Field</th><th>Value</th><th>Conf</th><th>Alternatives</th></tr>';
    for (const k of ['make','model','variant','year','fuel']) {
      const f = (v[k]||{});
      html += `<tr><td>${k}</td><td>${escHtml(String(f.value??'—'))}</td><td>${f.confidence??'—'}</td>`
        + `<td>${(f.alternatives||[]).join(', ')||'—'}</td></tr>`;
    }
    html += '</table>';
  } else { html += '<em>No parsed data.</em>'; }
  html += '</div>';

  // Sent tab
  html += '<div id="verify-tab-sent" class="tab-panel">';
  if (req) {
    const answered = res && res.answered_by ? `${res.answered_by.provider}: ${res.answered_by.model}` : 'none';
    html += `<b>Answered by:</b> ${escHtml(answered)}<br>`;
    html += `<b>Plate from OCR:</b> ${req.plate_from_ocr} &nbsp; <b>Frames sent:</b> ${(req.media||[]).length}<br>`;
    html += `<details><summary style="cursor:pointer;color:#aaa">System prompt</summary><pre>${escHtml(req.system_prompt||'')}</pre></details>`;
    html += `<details><summary style="cursor:pointer;color:#aaa">User prompt</summary><pre>${escHtml(req.user_prompt||'')}</pre></details>`;
    html += '<br><b>Frames:</b><br>';
    html += '<table><tr><th>Item</th><th>File</th><th>Bytes</th></tr>';
    for (const m of (req.media||[])) {
      html += `<tr><td>${escHtml(m.item_id)}</td><td>${escHtml(m.file)}</td><td>${m.bytes}</td></tr>`;
    }
    html += '</table>';
    html += `<br>${['03_verify/ocr.json','03_verify/request.json','03_verify/response.json']
      .map(p => `<a class="file-link" href="/api/runs/${runId}/files/${p}" target="_blank">${p}</a>`).join('')}`;
  } else { html += '<em>request.json not available.</em>'; }
  html += '</div>';

  document.getElementById('verify-content').innerHTML = html;
}

function showVerifyTab(name) {
  ['plate','attempts','findings','read','sent'].forEach(t => {
    const el = document.getElementById('verify-tab-' + t);
    if (el) el.classList.toggle('active', t === name);
  });
  document.querySelectorAll('#verify-section .tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['plate','attempts','findings','read','sent'][i] === name);
  });
}

// ---- Confirm (Stage 5) ----
function updateConfirmButton() {
  const btn = document.getElementById('confirm-start-btn');
  const reason = document.getElementById('confirm-btn-reason');
  if (!btn) return;
  const waiting = confirmPayload && !confirmDone;
  btn.disabled = verifyNodeStatus !== 'done' || waiting;
  btn.textContent = confirmDone ? 'Re-start confirm' : 'Start confirm';
  reason.textContent = verifyNodeStatus !== 'done' ? 'Verify not done' : waiting ? 'Waiting for you below' : '';
}

function doStartConfirm() {
  if (!currentRunId) return;
  document.getElementById('confirm-start-btn').disabled = true;
  fetch('/api/runs/' + currentRunId + '/confirm/start', {method: 'POST'})
    .then(r => r.json().then(d => ({ok: r.ok, data: d})))
    .then(({ok, data}) => {
      if (!ok) document.getElementById('confirm-btn-reason').textContent = data.error ? data.error.message : JSON.stringify(data);
      updateConfirmButton();
    })
    .catch(e => { document.getElementById('confirm-btn-reason').textContent = 'Error: ' + e; updateConfirmButton(); });
}

function cfVal(f) { return f && typeof f === 'object' ? f.value : null; }
function cfLow(f) {
  return !f || f.value === null || f.value === '' || (f.confidence || 0) < confirmPayload.expand_threshold;
}
function cfChips(id, values) {
  return (values || []).filter(v => v !== null && v !== '').map(v =>
    `<span class="chip" data-v="${escHtml(String(v))}" onclick="document.getElementById('${id}').value=this.dataset.v">${escHtml(String(v))}</span>`).join('');
}
function cfSummary() {
  const v = confirmPayload.vehicle || {};
  const km = cfVal(confirmPayload.odometer_km);
  return ['make','model','variant','year'].map(k => cfVal(v[k])).filter(Boolean).join(' ')
    + (cfVal(v.fuel) ? ' · ' + cfVal(v.fuel) : '')
    + (confirmPayload.city.value ? ' · ' + confirmPayload.city.value : '')
    + (km !== null && km !== undefined ? ' · ' + Number(km).toLocaleString('en-IN') + ' km' : '');
}

function renderConfirmForm() {
  const p = confirmPayload, v = p.vehicle || {};
  const row = (label, id, field, flag, note) => `<div class="cf-row ${flag ? 'cf-flag' : ''}"><span>${label}</span>
    <input id="${id}" value="${escHtml(cfVal(field) ?? '')}" placeholder="${note || ''}">
    <span>${cfChips(id, field && field.alternatives)}</span></div>`;
  const year = cfVal(v.year);
  const yearOpts = ['<option value="">—</option>'].concat((p.year_options || []).map(y =>
    `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`)).join('');
  const kmVal = cfVal(p.odometer_km);
  let html = `<div class="cf-note">AI detected: ${escHtml(cfSummary()) || '(nothing)'}
    <button onclick="document.getElementById('cf-form').style.display=''" style="margin-left:8px">Edit details</button>
    <button onclick="doConfirm()">Confirm and continue</button></div>`;
  html += `<div id="cf-form" style="display:${p.expand ? '' : 'none'}">`;
  html += row('Make', 'cf-make', v.make, cfLow(v.make));
  html += row('Model', 'cf-model', v.model, cfLow(v.model));
  html += row('Variant', 'cf-variant', v.variant, false, 'optional');
  html += `<div class="cf-row ${cfLow(v.year) ? 'cf-flag' : ''}"><span>Year</span><select id="cf-year">${yearOpts}</select>
    <span>${cfChips('cf-year', [year].concat((v.year && v.year.alternatives) || []))}</span></div>`;
  html += row('Fuel', 'cf-fuel', v.fuel, false);
  html += `<div class="cf-row"><span>Plate</span><input id="cf-plate" value="${escHtml((p.plate || {}).text || '')}">
    <span>${cfChips('cf-plate', (p.plate || {}).alternatives)}</span></div>`;
  html += `<div class="cf-row ${p.city.value ? '' : 'cf-flag'}"><span>City</span>
    <input id="cf-city" list="cf-city-list" value="${escHtml(p.city.value || '')}" placeholder="type 2 letters">
    <span>${cfChips('cf-city', p.city.candidates.slice(0, 8).map(c => c.city))}</span></div><datalist id="cf-city-list"></datalist>`;
  if (p.odometer_found) {
    html += `<div class="cf-row"><span>Km</span><input id="cf-km" type="number" min="0" value="${kmVal ?? ''}"><span></span></div>`;
  }
  html += '</div>';
  if (!p.tyres_assessed) {
    html += `<div class="cf-note">Tyres weren't visible. This may affect the report.
      <button disabled title="Coming in Stage 6">Upload photo</button>
      <label><input type="checkbox" id="cf-skip-tyre" checked> Skip</label></div>`;
  }
  if (!p.odometer_found) {
    html += `<div class="cf-note">Odometer wasn't visible.
      <input id="cf-km" type="number" min="0" placeholder="Type km" style="width:120px">
      <button disabled title="Coming in Stage 6">Upload photo</button> (leave empty to skip)</div>`;
  }
  html += '<div id="cf-error" class="status"></div>';
  document.getElementById('confirm-content').innerHTML = html;
  const q = p.city.state ? '?state=' + encodeURIComponent(p.city.state) : '';
  fetch('/api/cities' + q).then(r => r.json()).then(list => {
    window.cfCities = list;
    document.getElementById('cf-city-list').innerHTML = list.map(c => `<option value="${escHtml(c.city)}">`).join('');
  }).catch(() => {});
}

function doConfirm() {
  const get = id => { const el = document.getElementById(id); const t = el ? el.value.trim() : ''; return t === '' ? null : t; };
  const year = get('cf-year'), km = get('cf-km'), city = get('cf-city');
  if (!get('cf-make') || !get('cf-model')) {
    document.getElementById('cf-form').style.display = '';
    document.getElementById('cf-error').textContent = 'Make and model are needed.';
    return;
  }
  const skipped = [];
  const tyre = document.getElementById('cf-skip-tyre');
  if (tyre && tyre.checked) skipped.push('tyre_photo');
  if (!confirmPayload.odometer_found && km === null) skipped.push('odometer');
  const known = (confirmPayload.city.candidates || []).concat(window.cfCities || []).find(c => c.city === city);
  const body = {
    car: {make: get('cf-make'), model: get('cf-model'), variant: get('cf-variant'),
          year: year === null ? null : Number(year), fuel: get('cf-fuel')},
    plate: get('cf-plate'), city: city,
    state: known ? known.state : (city ? confirmPayload.city.state : null),
    odometer_km: km === null ? null : Number(km), skipped: skipped,
  };
  fetch('/api/runs/' + currentRunId + '/confirm', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    .then(r => r.json().then(d => ({ok: r.ok, data: d})))
    .then(({ok, data}) => {
      if (!ok) document.getElementById('cf-error').textContent = data.error ? data.error.message : JSON.stringify(data.detail || data);
    })
    .catch(e => { document.getElementById('cf-error').textContent = 'Error: ' + e; });
}

function loadConfirmRecord(runId) {
  fetch('/api/runs/' + runId + '/files/04_confirm.json').then(r => r.ok ? r.json() : null).then(rec => {
    if (!rec) return;
    document.getElementById('confirm-content').innerHTML =
      '<div class="status">Saved 04_confirm.json — changed: ' + escHtml(rec.changed.join(', ') || 'nothing') + '</div><pre>' + escHtml(JSON.stringify(rec, null, 2)) + '</pre>';
  }).catch(() => {});
}

function loadPlanFiles(runId, ev) {
  const get = f => fetch('/api/runs/' + runId + '/files/06_plan/' + f).then(r => r.ok ? r.json() : null).catch(() => null);
  Promise.all([get('queries.json'), get('request.json'), get('response.json')]).then(([q, req, res]) => {
    const list = qs => '<ul>' + (qs || []).map(x => '<li>' + escHtml(x) + '</li>').join('') + '</ul>';
    let html = '';
    if (ev.type !== 'node_done') html += '<div class="cf-note">' + escHtml(ev.data.error || ev.data.reason || '') + '</div>';
    if (q) {
      html += '<div class="status">' + (q.llm_called ? 'LLM called' : 'No damage: listing queries only, no LLM call')
        + (res && res.answered_by ? ' — answered by ' + escHtml(res.answered_by.model) : '') + '</div>';
      html += '<b>Listing</b> (seed ' + q.listing_seed + ')' + list(q.listing);
      q.parts.forEach(p => { html += '<b>' + escHtml(p.part) + '</b> ' + escHtml((p.finding_ids || []).join(', '))
        + ' · ' + escHtml([p.issue, p.severity, p.action].filter(Boolean).join(' / ')) + list(p.queries); });
      q.tyres.forEach(t => { html += '<b>Tyre ' + escHtml(t.item_id) + ' ' + escHtml(t.position || '') + '</b>: '
        + escHtml(t.tier) + ' — ' + escHtml(t.reason || '') + list(t.queries); });
      html += '<div>Tyres not seen: ' + escHtml(q.tyres_not_seen.join(', ') || 'none') + '</div>';
      html += '<div>Problems: ' + (q.problems.length ? list(q.problems) : 'none') + '</div>';
    }
    if (req) html += '<details><summary>Sent (prompts)</summary><pre>' + escHtml(req.system_prompt + '\n\n---\n\n' + req.user_prompt) + '</pre></details>';
    if (res) html += '<details><summary>Received (attempts, raw JSON)</summary><pre>' + escHtml(JSON.stringify(res, null, 2)) + '</pre></details>';
    document.getElementById('plan-content').innerHTML = html;
  });
}

// ---- Search (Stage 7b) ----
function updateSearchButton() {
  const btn = document.getElementById('search-btn');
  const reason = document.getElementById('search-btn-reason');
  if (!btn) return;
  btn.disabled = planNodeStatus !== 'done' || searchIsRunning;
  btn.textContent = (searchNodeStatus === 'done' || searchNodeStatus === 'failed') ? 'Re-run search' : 'Run search';
  reason.textContent = planNodeStatus !== 'done' ? 'Plan not done' : searchIsRunning ? 'Running… (uses Tavily credits)' : 'Uses Tavily credits';
}

function doRunSearch() {
  if (!currentRunId) return;
  document.getElementById('search-btn').disabled = true;
  fetch('/api/runs/' + currentRunId + '/search', {method: 'POST'})
    .then(r => r.json().then(d => ({ok: r.ok, data: d})))
    .then(({ok, data}) => {
      if (!ok) document.getElementById('search-btn-reason').textContent = data.error ? data.error.message : JSON.stringify(data);
      updateSearchButton();
    })
    .catch(e => { document.getElementById('search-btn-reason').textContent = 'Error: ' + e; updateSearchButton(); });
}

function loadSearchResults(runId, ev) {
  fetch('/api/runs/' + runId + '/files/07_search/results.json').then(r => r.ok ? r.json() : null).catch(() => null).then(d => {
    let html = ev.type !== 'node_done' ? '<div class="cf-note">' + escHtml(ev.data.error || ev.data.reason || '') + '</div>' : '';
    if (d) {
      const t = d.totals;
      html += `<div class="status">${t.queries} queries · ${t.failed} failed · ${t.results} results · ${t.unique_urls} unique URLs · ~${t.credits_estimate} credits · ${t.elapsed_s} s</div>`;
      d.queries.forEach(q => {
        html += '<details><summary>[' + escHtml(q.kind) + (q.for ? ' ' + escHtml(q.for) : '') + '] ' + escHtml(q.query)
          + ' — ' + q.results.length + ' results, ' + q.seconds + ' s' + (q.error ? ' — ERROR' : '') + '</summary>';
        if (q.error) html += '<div class="cf-note">' + escHtml(q.error) + '</div>';
        html += '<ul>' + q.results.map(r => '<li><a href="' + escHtml(r.url) + '" target="_blank" rel="noopener">'
          + escHtml(r.title || r.url) + '</a><br><span class="status">' + escHtml(String(r.content || '').slice(0, 300)) + '</span></li>').join('') + '</ul></details>';
      });
    }
    document.getElementById('search-content').innerHTML = html;
  });
}

// Auto-load run from ?run= URL param
(function() {
  const params = new URLSearchParams(location.search);
  const rid = params.get('run');
  if (rid) loadRun(rid);
})();
</script>
