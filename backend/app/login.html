<!doctype html>
<!-- Plain sign-in page (platform step 5, P1). The real frontend replaces it later; the API stays. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CarLens sign in</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #ddd; display: flex; justify-content: center; padding-top: 10vh; }
  .box { width: 320px; }
  h1 { font-size: 20px; }
  label { display: block; margin: 12px 0 4px; font-size: 13px; color: #aaa; }
  input { width: 100%; padding: 8px; box-sizing: border-box; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; }
  button { margin-top: 16px; padding: 8px 14px; background: #2d6cdf; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  .link { background: none; color: #8bf; padding: 0; margin-top: 12px; font-size: 13px; }
  .or { margin: 18px 0 10px; font-size: 12px; color: #777; }
  #msg { margin-top: 12px; min-height: 18px; color: #f88; font-size: 13px; }
  #signedin a { color: #8bf; }
  .hidden { display: none; }
  #tester { margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
  #tester h2 { font-size: 15px; }
  #runs { list-style: none; padding: 0; font-size: 13px; }
  #runs li { padding: 6px 0; border-bottom: 1px solid #222; }
  #runs button, #dup button { margin: 4px 6px 0 0; padding: 4px 10px; font-size: 12px; }
  #live { font-size: 12px; color: #9c9; min-height: 16px; }
  .box { width: 360px; }
</style>
</head>
<body>
<div class="box">
  <h1>CarLens</h1>

  <div id="signedout" class="hidden">
    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password <span id="pwHint" class="hidden">(at least 10 characters)</span></label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div id="codeRow" class="hidden">
        <label for="code">Authenticator code</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      </div>
      <button type="submit" id="submit">Sign in</button>
    </form>
    <button class="link" id="toggle">No account? Request access</button>
    <div class="or">or</div>
    <div id="googleBtn"></div>
  </div>

  <div id="signedin" class="hidden">
    <p>Signed in as <b id="who"></b>.</p>
    <p id="state"></p>
    <p id="adminLink" class="hidden"><a href="/inspector">Open the inspector</a></p>
    <button id="logout">Sign out</button>

    <!-- Tester test section (stage 5.3, owner option a): until the frontend exists. Same API the frontend will use. -->
    <div id="tester" class="hidden">
      <h2>Your runs (test section)</h2>
      <input id="video" type="file" accept="video/*">
      <button id="upload">Upload</button>
      <div id="dup" class="hidden">
        <p>You uploaded this video before.</p>
        <button id="openOld">Open the old run (free)</button>
        <button id="fresh">Start a fresh run (1 token)</button>
      </div>
      <div id="live"></div>
      <ul id="runs"></ul>
    </div>
  </div>

  <div id="msg"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const GOOGLE_CLIENT_ID = "__GOOGLE_CLIENT_ID__";
let signingUp = false;

function stateText(me) {
  if (me.role === "admin") return "Admin.";
  if (me.status === "approved") return `Access approved: ${me.tokens} run(s) left.`;
  if (me.status === "rejected") return "Your access request was not approved.";
  return "Access requested. You can use CarLens once the owner approves it.";
}

function show(me) {
  $("signedout").classList.toggle("hidden", !!me);
  $("signedin").classList.toggle("hidden", !me);
  if (!me) return;
  $("who").textContent = me.email;
  $("state").textContent = stateText(me);
  $("adminLink").classList.toggle("hidden", me.role !== "admin");
  const tester = me.role !== "admin" && me.status === "approved";
  $("tester").classList.toggle("hidden", !tester);
  if (tester) loadRuns();
}

// --- tester test section (stage 5.3) ---
let pendingId = null, oldRunId = null, source = null;

async function refreshMe() {
  const r = await fetch("/api/auth/me");
  if (r.ok) $("state").textContent = stateText(await r.json());
}

async function loadRuns() {
  const r = await fetch("/api/runs");
  if (!r.ok) return;
  const list = $("runs");
  list.innerHTML = "";
  for (const run of (await r.json()).runs) {
    const li = document.createElement("li");
    li.textContent = `${run.file} · ${run.status}${run.failed_at ? " at " + run.failed_at : ""} · ${run.created_at.slice(0, 16).replace("T", " ")} `;
    const watch = document.createElement("button");
    watch.textContent = "Watch";
    watch.onclick = () => watchRun(run.run_id);
    li.appendChild(watch);
    if (run.status === "failed") {
      const resume = document.createElement("button");
      resume.textContent = "Resume (free)";
      resume.onclick = async () => {
        const res = await fetch(`/api/runs/${run.run_id}/resume`, { method: "POST" });
        if (res.ok) watchRun(run.run_id); else showError(await res.json());
      };
      li.appendChild(resume);
    }
    list.appendChild(li);
  }
}

function showError(data) {
  $("msg").textContent = data.error ? data.error.message : (data.detail && data.detail.error ? data.detail.error.message : "That did not work.");
}

// Opening the event stream also starts a new run's pipeline (as in the inspector).
function watchRun(runId) {
  if (source) source.close();
  $("live").textContent = `Run ${runId}: connecting…`;
  source = new EventSource(`/api/runs/${runId}/events`);
  source.onmessage = e => {
    const ev = JSON.parse(e.data);
    $("live").textContent = `Run ${runId}: ${ev.node} ${ev.type}`;
    if (ev.node === "pipeline" && ev.type === "run_done") {
      $("live").textContent = `Run ${runId}: finished (${ev.data.status})`;
      source.close(); source = null; loadRuns(); refreshMe();
    }
  };
}

async function afterStart(res) {
  const data = await res.json();
  if (res.ok) { $("dup").classList.add("hidden"); refreshMe(); loadRuns(); watchRun(data.run_id); return; }
  if (data.error && data.error.code === "same_video") {
    pendingId = data.pending_id; oldRunId = data.duplicate_of;
    $("dup").classList.remove("hidden");
    return;
  }
  showError(data);
}

$("upload").addEventListener("click", async () => {
  const file = $("video").files[0];
  if (!file) return;
  $("msg").textContent = "";
  $("live").textContent = "Uploading… (large videos take a while)";
  const form = new FormData();
  form.append("video", file);
  await afterStart(await fetch("/api/runs", { method: "POST", body: form }));
  if ($("live").textContent.startsWith("Uploading")) $("live").textContent = "";
});

$("openOld").addEventListener("click", async () => {
  await fetch(`/api/uploads/${pendingId}`, { method: "DELETE" });
  $("dup").classList.add("hidden");
  watchRun(oldRunId);
});

$("fresh").addEventListener("click", async () => {
  $("msg").textContent = "";
  await afterStart(await fetch(`/api/uploads/${pendingId}/start`, { method: "POST" }));
});

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return { ok: r.ok, data: await r.json() };
}

function setMode(up) {
  signingUp = up;
  $("submit").textContent = up ? "Request access" : "Sign in";
  $("toggle").textContent = up ? "Have an account? Sign in" : "No account? Request access";
  $("pwHint").classList.toggle("hidden", !up);
  $("password").autocomplete = up ? "new-password" : "current-password";
  $("codeRow").classList.add("hidden");
  $("msg").textContent = "";
}

fetch("/api/auth/me").then(r => r.ok ? r.json() : null).then(show);

$("toggle").addEventListener("click", () => setMode(!signingUp));

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("msg").textContent = "";
  const res = signingUp
    ? await post("/api/auth/signup", { email: $("email").value, password: $("password").value })
    : await post("/api/auth/login", { email: $("email").value, password: $("password").value, code: $("code").value || null });
  if (res.ok) { show(res.data); if (res.data.role === "admin") location.href = "/inspector"; return; }
  if (res.data.error && res.data.error.code === "code_required") { $("codeRow").classList.remove("hidden"); $("code").focus(); }
  $("msg").textContent = res.data.error ? res.data.error.message : "That did not work.";
});

$("logout").addEventListener("click", async () => {
  await fetch("/api/auth/logout", { method: "POST" });
  $("password").value = ""; $("code").value = "";
  show(null);
});

// Google button (Google Identity Services): Google gives the page a signed ID token; the backend checks it.
window.addEventListener("load", () => {
  if (!GOOGLE_CLIENT_ID || !window.google) { $("googleBtn").textContent = "Google sign-in is not set up."; return; }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: async resp => {
      $("msg").textContent = "";
      const res = await post("/api/auth/google", { credential: resp.credential });
      if (res.ok) show(res.data); else $("msg").textContent = res.data.error ? res.data.error.message : "Google sign-in failed.";
    },
  });
  google.accounts.id.renderButton($("googleBtn"), { theme: "filled_black", size: "large", width: 320 });
});
</script>
</body>
</html>
