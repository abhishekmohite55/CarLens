upload:
  allowed_types: [mp4, mov, webm]
  max_size_mb: 500
  max_duration_sec: 300

models: # fill model names before each stage
  locate:
    {
      provider: google_genai,
      model: gemini-3.8-flash,
      fallback_model: gemini-3.5-flash,
    }
  verify: { provider: google_genai, model: TBD }
  photos: { provider: google_genai, model: TBD }
  plan: { provider: google_genai, model: TBD }
  extract: { provider: google_genai, model: TBD }
  temperature: 0.2
  timeout_sec: 180
  locate_media_resolution: medium
  locate_thinking_level:        # empty = model default; or minimal | low | medium | high

locate_video:                   # copy sent to Gemini locate; frames always use the original
  shrink: true
  height: 1080
  fps: 5
  crf: 23

frames:
  window_sec: 5
  sample_fps: 2
  odometer_window_sec: 3
  odometer_sample_fps: 4
  keep_per_item: 4
  max_long_edge_px: 1280
  jpeg_quality: 90

confirm:
  expand_below_confidence: 0.6

pricing:
  year_tolerance: 1
  min_comparables: 3

paths:
  runs_dir: runs
  prompts_dir: prompts
