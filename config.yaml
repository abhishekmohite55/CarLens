upload:
  allowed_types: [mp4, mov, webm]
  max_size_mb: 500
  max_duration_sec: 300

models: # fill model names before each stage
  locate:
    {
      provider: google_genai,
      model: gemini-3.8-flash,
      fallback_model: gemini-3.5-flash,
    }
  verify_chain: # tried top to bottom; the next one runs on error, invalid answer or after verify_timeout_per_model_sec. Reorder freely.
    - { provider: google_genai, model: gemini-3.8-flash }
    - { provider: google_genai, model: gemini-3.5-flash }
    - { provider: openrouter, model: nvidia/nemotron-3.5-super-vl:free }
    - { provider: openrouter, model: google/gemma-4-26b-a4b-it:free }
  photos_chain: # reads the extra tyre/odometer photos added at confirm (Stage 6); tried top to bottom like verify_chain
    - { provider: google_genai, model: gemini-3.8-flash }
    - { provider: google_genai, model: gemini-3.5-flash }
    - { provider: openrouter, model: nvidia/nemotron-3.5-super-vl:free }
    - { provider: openrouter, model: google/gemma-4-26b-a4b-it:free }
  photos_timeout_per_model_sec: 180
  plan_chain: # writes part/tyre search queries; tried top to bottom like verify_chain. Reorder freely.
    - { provider: google_genai, model: gemini-3.8-flash }
    - { provider: google_genai, model: gemini-3.5-flash }
    - { provider: openrouter, model: nvidia/nemotron-3.5-super-vl:free }
    - { provider: openrouter, model: google/gemma-4-26b-a4b-it:free }
  plan_timeout_per_model_sec: 120
  extract_chain: # copies prices out of trimmed search snippets; tried top to bottom. crouton-alpha: 54 s vs Nemotron 187 s on bumper_tyre (4 Nov); stealth model, may disappear
    - { provider: google_genai, model: gemini-3.5-flash }
    - { provider: google_genai, model: gemini-3.8-flash }
    - { provider: openrouter, model: liquid/lfm-3-1.7b:free } # owner 10 Nov: replaces inkling-2-small (gone from OpenRouter)
    - { provider: openrouter, model: nvidia/nemotron-3.5-super-vl:free }
    - { provider: openrouter, model: google/gemma-4-26b-a4b-it:free }
  extract_timeout_per_model_sec: 300
  extract_reasoning_effort: low # OpenRouter entries only: none | minimal | low | medium | high; empty = model default
  temperature: 0.2
  timeout_sec: 180
  locate_media_resolution: medium
  verify_media_resolution: medium # frames sent to verify: low | medium | high
  verify_thinking_level: low # Gemini entries only; empty = model default; or minimal | low | medium | high
  verify_timeout_per_model_sec: 180
  locate_thinking_level: low # empty = model default; or minimal | low | medium | high

locate_video: # copy sent to Gemini locate; frames always use the original
  shrink: true
  height: 1080
  fps: 5
  crf: 23

frames:
  window_sec: 1.5 # ± around each locate timestamp (all items, odometer too)
  sample_fps: 15 # 45 frames per item; nearest source frame for each sample
  score_scale: 0.5 # sharpness scored on a half-size grayscale copy
  workers: 0 # parallel items; 0 = CPU count
  max_long_edge_px: 1280 # saved JPEG (sharpest frame only)
  jpeg_quality: 90

confirm:
  expand_below_confidence: 0.6 # open the form if make, model or year is missing or below this (variant is optional)
  year_range: 8 # year picker shows the AI's year +- this, never past the current year

photos: # extra photos at confirm (Stage 6): 4 optional tyre slots + 1 odometer slot (only when the video read no km)
  allowed_types: [jpg, jpeg, png, webp, heic] # heic: iPhone photos, decoded with pillow-heif
  max_size_mb: 10
  km_min_confidence: 0.8 # photo km replaces the confirmed km only at this confidence or higher (owner, 5 Nov)

plan:
  queries_per_part: 4 # LLM queries per damaged part and per tyre marked "replace"
  listing_queries_per_run: 4 # picked at random from listing_templates each run
  tyre_ok_score: 7 # tyres scored below this, or with tread worn/bald (even unscored), go to the plan LLM
  listing_templates: # Python fills these from 04_confirm.json; a template with an empty field is skipped.
    # Keep at most 2 with {city}: small RTO towns (e.g. Dudu) find no listings, so any 4 picked include 2+ state/India queries.
    - "used {make} {model} {year} {fuel} price in {city}"
    - "second hand {make} {model} {year} for sale {state}"
    - "{make} {model} {variant} {year} used car price {city}"
    - "used {model} {year} {fuel} price {state}"
    - "used {make} {model} {variant} price {state}"
    - "buy used {make} {model} {year} {state} cars24 spinny cardekho"
    - "second hand {make} {model} {fuel} price list {state}"
    - "used {make} {model} cars for sale {state} all years"
  new_price_queries_per_run: 2 # today's new-car price (on-road / ex-showroom), picked at random from new_price_templates
  new_price_templates: # no {year}: we want today's price of the model; {variant} templates skipped when variant is empty
    - "{make} {model} {variant} on road price {city}"
    - "{make} {model} {variant} ex-showroom price"
    - "{make} {model} on road price {city} all variants"
    - "{make} {model} {fuel} ex-showroom price list variants"
    - "new {make} {model} {variant} {fuel} price {state}"

search: # Tavily (node 7); free plan 1,000 credits/month, basic = 1 credit, advanced = 2
  depth: basic # basic | advanced
  max_results: 5 # results per query
  include_raw_content: false # false = short snippet only; true = whole page text (more tokens for extract)
  include_domains: [] # empty = whole web; e.g. [cardekho.com, cars24.com]
  exclude_domains: [tavily.com] # tavily.com company-profile pages filled result slots with no prices
  country: india # boosts results from this country
  workers: 4 # queries run in parallel

extract: # trimming before the extract LLM (node 8)
  max_results_per_group: 15 # per listing / part / tyre group, best Tavily score first
  max_snippet_chars: 800
  listing_min_inr: 100000 # car prices (listing / new price) under ₹1 lakh are dropped; nothing above listing_max_inr
  listing_max_inr: 10000000
  outlier_factor: 3 # parts/tyres (and several prices in one figure): drop above 3x or below 1/3 of the median (2+ values)

pricing:
  max_from_top: 3 # price max = average of the top 3 yearly rates, so one odd listing can't set the top
  min_listing_age: 2 # listings younger than 2 years are skipped: year-1 prices swing too much to give a reliable yearly rate
  min_listings_with_year: 3 # fewer listings with a stated year → valuation unavailable
  tyre_minor_wear_deduction_inr: 5000 # fixed deduction per tyre the plan LLM marks minor_wear (from config, not the internet)
  year_tolerance: 3 # listings within ±3 years of the car feed the depreciation rate (owner, 5 Nov)
  min_comparables: 3

dev: # platform step 2 testing: the pipeline ends after this node; re-run buttons start the next ones
  stop_after: locate # node name, or empty for the full pipeline

paths:
  runs_dir: runs
  prompts_dir: prompts
