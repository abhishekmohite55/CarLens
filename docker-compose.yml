# Dev database for the laptop (platform step 1) and the backend image (step 3).
# Daily work: docker compose up -d postgres pgadmin (backend from its venv).
# Prove the images: docker compose up -d (stop the venv server first: both use port 8000).
# Frontend container: http://127.0.0.1:8080 (step 6.5); daily frontend work stays on npm run dev (:5173).
# Values in ${...} come from .env next to this file (see .env.example).
services:
  postgres:
    image: postgres:17 # same major version as Supabase (production)
    environment:
      POSTGRES_DB: carlens
      POSTGRES_USER: carlens
      # Read only on the first start with an empty volume; changing .env later does not change it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432" # this laptop only, not the Wi-Fi network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # "healthy" once the database accepts connections; the backend waits for it
      test: ["CMD-SHELL", "pg_isready -U carlens -d carlens"]
      interval: 2s
      timeout: 5s
      retries: 15

  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  backend:
    build:
      context: . # repo root; .dockerignore keeps .env, runs/ and videos out
      dockerfile: backend/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    env_file: .env # secrets as environment variables, never in the image
    environment:
      # Inside Docker the database host is the service name, not 127.0.0.1.
      # Written whole in .env: a password with @ or other special characters must be URL-encoded (@ = %40).
      DATABASE_URL: ${DOCKER_DATABASE_URL:?set DOCKER_DATABASE_URL in .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes: # laptop files shown inside the container; edits apply live
      - ./config.yaml:/carlens/config.yaml
      - ./prompts:/carlens/prompts
      - ./runs:/carlens/runs
    depends_on:
      postgres:
        condition: service_healthy

  frontend: # platform step 6.5: nginx serves the admin and tester apps and passes /api to the backend
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80" # open http://127.0.0.1:8080/admin
    depends_on:
      - backend

volumes:
  pgdata:
  pgadmin_data:
