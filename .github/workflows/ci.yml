# CI (platform step 4, docs/platform/04-ci-tests.md): lint, tests with Postgres, backend image build.
# Runs on pull requests into main only (owner, 12 Nov 2026): one branch and one PR per platform step, so CI runs
# once per step (and again for each fix pushed to that PR), not for every stage commit.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      # pyflakes rules only (unused imports, undefined names); honours "# noqa"
      - run: ruff check --select F backend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17 # same major as the laptop and Supabase
        env:
          POSTGRES_DB: carlens_test
          POSTGRES_USER: carlens
          POSTGRES_PASSWORD: ci # throwaway database inside the runner, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carlens -d carlens_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://carlens:ci@127.0.0.1:5432/carlens_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # pytest is a dev tool, not in requirements.txt (keeps it out of the image); same version as the venv
      - run: pip install -r requirements.txt pytest==9.2.0
      - run: python -m pytest -q -rs # -rs lists every skipped test with its reason

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Plain docker build: compose would need .env. The image never needs it. Not pushed (CD, step 9).
      - run: docker build -f backend/Dockerfile --build-arg GIT_COMMIT=${GITHUB_SHA::7} -t carlens-backend:ci .
