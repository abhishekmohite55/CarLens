# CI (platform step 4, docs/platform/04-ci-tests.md): lint, tests with Postgres, backend image build;
# frontend type check + build and frontend image build (step 6.5).
# Runs on pull requests into main only (owner, 12 Nov 2026): one branch and one PR per platform step, so CI runs
# once per step (and again for each fix pushed to that PR), not for every stage commit.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call: # step 9: the Deploy workflow runs the same checks first (docs/platform/09-cd.md, Q3)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      # hardening S12: locked versions + hashes, wheels only (ruff is in requirements-dev.lock)
      - run: "pip install --require-hashes --only-binary :all: -r backend/requirements-dev.lock"
      # pyflakes rules only (unused imports, undefined names); honours "# noqa"
      - run: ruff check --select F backend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17 # same major as the laptop and Supabase
        env:
          POSTGRES_DB: carlens_test
          POSTGRES_USER: carlens
          POSTGRES_PASSWORD: ci # throwaway database inside the runner, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carlens -d carlens_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://carlens:ci@127.0.0.1:5432/carlens_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      # hardening S12: the app's packages + pytest, locked with hashes, wheels only (pytest stays out of the image)
      - run: "pip install --require-hashes --only-binary :all: -r requirements-dev.lock"
      - run: python -m pytest -q -rs # -rs lists every skipped test with its reason

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Plain docker build: compose would need .env. The image never needs it. Not pushed (CD, step 9).
      - run: docker build -f backend/Dockerfile --build-arg GIT_COMMIT=${GITHUB_SHA::7} -t carlens-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0" # same as the laptop and the image
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts # hardening S12: no package install scripts (only fsevents has one, macOS only)
      - run: npm run build # type check (tsc) + both apps (vite)
      # The image too, so a broken Dockerfile or nginx.conf shows here. Not pushed (CD, step 9).
      - run: docker build -t carlens-frontend:ci .
      # Hardening E: start the image and check it really serves (nginx needs the name "backend" to start).
      - name: Start the image and check the pages
        run: |
          docker run -d --name fe --add-host backend:127.0.0.1 -p 8080:8080 carlens-frontend:ci
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsS -D headers.txt -o page.html http://127.0.0.1:8080/
          grep -qi '^content-security-policy' headers.txt
          grep -qi '^strict-transport-security' headers.txt
          grep -q 'id="root"' page.html
          curl -fsS -o /dev/null http://127.0.0.1:8080/admin/
          test "$(docker exec fe id -u)" != "0" # nginx runs as a normal user (hardening S15)
      - name: Frontend container log
        if: failure()
        run: docker logs fe || true
